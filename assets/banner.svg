<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#text-grad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #94a3b8; letter-spacing: 1px; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #f8fafc; }
    
    /* Dynamic pulsing animation */
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(400px); }
    }
    .pulsing-ring { animation: pulseRing 4s infinite ease-in-out; transform-origin: 150px 160px; }
    .scan-beam { animation: scanline 6s infinite linear; opacity: 0.15; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200" />
    <path d="M100 0 V320 M200 0 V320 M300 0 V320 M400 0 V320 M500 0 V320 M600 0 V320 M700 0 V320 M800 0 V320 M900 0 V320 M1000 0 V320 M1100 0 V320" />
  </g>

  <!-- Shield Icon Graphic -->
  <g transform="translate(45, 0)">
    <circle class="pulsing-ring" cx="150" cy="160" r="85" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 6"/>
    <path d="M150 75 L210 105 V165 C210 205 150 240 150 240 C150 240 90 205 90 165 V105 Z" fill="url(#shield-grad)" opacity="0.25"/>
    <path d="M150 85 L200 110 V160 C200 195 150 225 150 225 C150 225 100 195 100 160 V110 Z" fill="none" stroke="url(#text-grad)" stroke-width="4" filter="url(#glow)"/>
    
    <!-- Lock inside Shield -->
    <rect x="135" y="145" width="30" height="26" rx="4" fill="#38bdf8"/>
    <path d="M142 145 V137 C142 132 145 128 150 128 C155 128 158 132 158 137 V145" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="150" cy="156" r="3" fill="#0f172a"/>
  </g>

  <!-- Text Content -->
  <g transform="translate(310, 0)">
    <text x="0" y="125" class="title" filter="url(#glow)">Awesome Prompt Security Platform 🛡️</text>
    <text x="0" y="165" class="subtitle">Curated AI Runtime Security, Prompt Injection Defense &amp; Guardrails Ecosystem</text>
    
    <!-- Feature Badges -->
    <g transform="translate(0, 200)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="18" cy="17" r="6" fill="#10b981"/>
      <text x="32" y="22" class="badge-text">Prompt Injection</text>

      <!-- Badge 2 -->
      <rect x="175" y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="193" cy="17" r="6" fill="#6366f1"/>
      <text x="207" y="22" class="badge-text">LLM Guardrails</text>

      <!-- Badge 3 -->
      <rect x="350" y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="368" cy="17" r="6" fill="#ec4899"/>
      <text x="382" y="22" class="badge-text">Jailbreak Prevention</text>

      <!-- Badge 4 -->
      <rect x="525" y="0" width="170" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="543" cy="17" r="6" fill="#f59e0b"/>
      <text x="557" y="22" class="badge-text">AI Runtime Security</text>
    </g>
  </g>
</svg>
